      per_extension: true
      severity: WARN
      expected_from_lookup:
        table: sat_BIAS
        keys: *id001
        max_field: frac_max
    - name: saturation_gross
      region: full_frame
      metric: saturated_fraction
      per_extension: true
      severity: FAIL
      limits:
        max: 0.01
    - name: ccd_temperature_warm
      severity: WARN
      per_extension: true
      header_check:
        op: range
        per_extension_key:
        - CCDTEMP_1
        - CCDTEMP1
        - CCDTEMP-1
